[package]
name = "outlayer-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.9.0", features = ["legacy", "unit-testing", "unstable"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
base64 = "0.21.7"
sha2 = "0.10.8"
hex = "0.4"
bs58 = "0.5"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.19.0-rust-1.86.0"
image_digest = "sha256:772638e343baeeea24e49062c7d424274f3441452cc06ce97fc4e5695b19fecc"
passed_env = []
container_build_command = [
  "cargo",
  "near",
  "build",
  "non-reproducible-wasm",
  "--locked",
  "--no-embed-abi",
]


[dev-dependencies]
near-workspaces = "0.14.1"
tokio = { version = "1.40", features = ["full"] }

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true
